name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow this workflow to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: slidev/package-lock.json

      - name: Install Slidev dependencies
        working-directory: slidev
        run: npm ci

      # The site is served from the custom domain https://postgis.son.do/
      # so the deck lives at /slides/.
      - name: Build Slidev deck
        working-directory: slidev
        run: npm run build -- --base /slides/ --out dist

      - name: Assemble site
        run: |
          mkdir -p _site
          # Root interactive lecture
          cp index.html _site/
          cp tokens.css _site/
          # Interactive spatial explorer under /interactive/ (static; ships GeoJSON
          # snapshots of the teaching DB + MapLibre/Turf/DuckDB-WASM from CDNs).
          mkdir -p _site/interactive
          cp -r interactive/index.html interactive/app.js interactive/style.css interactive/data _site/interactive/
          # Preserve the custom domain on GitHub Pages
          echo 'postgis.son.do' > _site/CNAME
          # Slidev web deck under /slides/
          mkdir -p _site/slides
          cp -r slidev/dist/. _site/slides/
          # SPA fallback: the Slidev deck is a single-page app, so deep links
          # like /slides/4 (direct load, refresh, or shared link) have no file
          # on disk. GitHub Pages serves the site-root 404.html for any unmatched
          # path, so point it at the deck — it boots and client-routes to the
          # requested slide. (Stray non-/slides/ URLs also land here, a minor
          # cosmetic tradeoff; the only real root page, index.html, is unaffected.)
          cp slidev/dist/index.html _site/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
